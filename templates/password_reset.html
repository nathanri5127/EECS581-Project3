<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Runway Financial - Reset Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <h1>Reset Password</h1>

            <form method="POST">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >

                <label>New Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>
            </form>

            <p>
                Remembered your password?
                <a href="/login">Back to Login</a>
            </p>
        </div>
    </div>
</body>
</html>
